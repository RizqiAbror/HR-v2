<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Checklist - HR System v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .status-btn.active-pass { background-color: #10b981 !important; color: white !important; }
        .status-btn.active-fail { background-color: #ef4444 !important; color: white !important; }
        .status-btn.active-skip { background-color: #64748b !important; color: white !important; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">QA Checklist HRIS v2</h1>
                <p id="dateDisplay" class="text-xs text-slate-500 font-medium"></p>
            </div>
            <div class="flex items-center gap-6 w-full md:w-auto">
                <div class="flex-1 md:w-48">
                    <div class="flex justify-between text-[10px] font-black uppercase tracking-wider mb-1">
                        <span class="text-slate-400">Progress</span>
                        <span id="progressText" class="text-indigo-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-1.5">
                        <div id="progressBar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <button onclick="showSummary()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-800 transition-all flex items-center gap-2 shadow-lg shadow-slate-200">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Summary
                </button>
            </div>
        </div>
    </header>

    <div id="content" class="max-w-5xl mx-auto px-6 py-8 space-y-8">
        <!-- Rendered by JS -->
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden flex flex-col">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">UAT Summary Report</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                        <p class="text-[10px] font-bold text-emerald-600 uppercase mb-1">Passed</p>
                        <p id="sumPass" class="text-2xl font-black text-emerald-700">0</p>
                    </div>
                    <div class="bg-rose-50 p-4 rounded-xl border border-rose-100">
                        <p class="text-[10px] font-bold text-rose-600 uppercase mb-1">Failed</p>
                        <p id="sumFail" class="text-2xl font-black text-rose-700">0</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-600 uppercase mb-1">Skipped</p>
                        <p id="sumSkip" class="text-2xl font-black text-slate-700">0</p>
                    </div>
                </div>
                <div id="failureDetails" class="space-y-3"></div>
            </div>
            <div class="p-4 bg-slate-50 border-t flex justify-end">
                <button onclick="copySummary()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        const modules = [
            {
                name: "AUTH & ACCESS",
                items: [
                    "Buka URL /dashboard tanpa login → redirect ke /login",
                    "Login yola@kalapa.com / hr123 → masuk dashboard",
                    "Topbar menampilkan nama 'Bu Yola' dan role 'HR_ADMIN'",
                    "Logout → session hancur, tidak bisa back ke dashboard"
                ]
            },
            {
                name: "DATA KARYAWAN",
                items: [
                    "Tabel /employee memuat data & filter agent berfungsi",
                    "Search nama/NIK langsung memfilter tabel",
                    "Submit form karyawan baru → data tersimpan & muncul di tabel",
                    "Input NIK duplikat → sistem menolak",
                    "Download template Excel & Import data valid → berhasil",
                    "Import data error (agent salah) → ditangkap di list error",
                    "Upload PKWT di detail karyawan → berhasil simpan & muncul link lihat",
                    "Upload file > 5MB atau format dilarang → sistem menolak"
                ]
            },
            {
                name: "INPUT CUTI (LIVE SEARCH)",
                items: [
                    "/cuti/form: Live Search berfungsi mencari karyawan",
                    "Pilih karyawan → Info kuota & data karyawan muncul",
                    "Verifikasi kuota adalah milik karyawan terpilih (bukan HR)",
                    "Karyawan sisa cuti 0 → sistem blokir input cuti",
                    "Tanggal akhir < Tanggal mulai → sistem blokir",
                    "Hitung hari otomatis memotong Weekend & Libur Nasional",
                    "Hari pengajuan > Sisa cuti → tombol Simpan mati (disabled)",
                    "Submit valid → request_no muncul, status PENDING_HR"
                ]
            },
            {
                name: "MANAJEMEN CUTI (COMMAND CENTER)",
                items: [
                    "Halaman /cuti memuat log SEMUA pengajuan (terbaru di atas)",
                    "Filter cards (Pending, Approved, Rejected) berfungsi",
                    "HR Approve → status berubah APPROVED, kuota terpotong otomatis",
                    "HR Reject → status berubah REJECTED, kuota tidak terpotong",
                    "Audit log mencatat setiap perubahan status cuti"
                ]
            }
        ];

        let state = JSON.parse(localStorage.getItem('hris_qa_v2')) || {};

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            let globalIdx = 1;

            modules.forEach(mod => {
                const section = document.createElement('div');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';
                section.innerHTML = `<div class="px-6 py-4 bg-slate-50 border-b border-slate-100 font-bold text-slate-800 text-sm uppercase tracking-widest">${mod.name}</div>`;
                
                const list = document.createElement('div');
                list.className = 'divide-y divide-slate-100';

                mod.items.forEach(itemText => {
                    const id = globalIdx++;
                    const itemState = state[id] || { status: null, note: '' };
                    const row = document.createElement('div');
                    row.className = 'p-6 flex flex-col md:flex-row gap-4 items-start justify-between hover:bg-slate-50/50 transition-all';
                    row.innerHTML = `
                        <div class="flex gap-4 flex-1">
                            <span class="text-slate-300 font-bold text-sm">${id}.</span>
                            <div class="space-y-3 flex-1">
                                <p class="text-sm font-semibold text-slate-700">${itemText}</p>
                                <input type="text" id="note-${id}" value="${itemState.note}" oninput="saveNote(${id}, this.value)" 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none ${itemState.status === 'fail' ? '' : 'hidden'}" 
                                    placeholder="Catatan temuan bug...">
                            </div>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="update(${id}, 'pass')" class="status-btn px-4 py-1.5 rounded-lg border text-[10px] font-bold uppercase transition-all ${itemState.status === 'pass' ? 'active-pass' : 'border-slate-200 text-slate-400'}">Pass</button>
                            <button onclick="update(${id}, 'fail')" class="status-btn px-4 py-1.5 rounded-lg border text-[10px] font-bold uppercase transition-all ${itemState.status === 'fail' ? 'active-fail' : 'border-slate-200 text-slate-400'}">Fail</button>
                            <button onclick="update(${id}, 'skip')" class="status-btn px-4 py-1.5 rounded-lg border text-[10px] font-bold uppercase transition-all ${itemState.status === 'skip' ? 'active-skip' : 'border-slate-200 text-slate-400'}">Skip</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
                section.appendChild(list);
                container.appendChild(section);
            });
            updateProgress();
            lucide.createIcons();
        }

        function update(id, status) {
            state[id] = { ...state[id], status };
            localStorage.setItem('hris_qa_v2', JSON.stringify(state));
            render();
        }

        function saveNote(id, note) {
            state[id] = { ...state[id], note };
            localStorage.setItem('hris_qa_v2', JSON.stringify(state));
        }

        function updateProgress() {
            const total = modules.reduce((a, b) => a + b.items.length, 0);
            const done = Object.values(state).filter(s => s.status).length;
            const pct = total === 0 ? 0 : Math.round((done / total) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').innerText = pct + '%';
        }

        function showSummary() {
            let p = 0, f = 0, s = 0;
            let details = '';
            let globalIdx = 1;

            modules.forEach(mod => {
                mod.items.forEach(item => {
                    const id = globalIdx++;
                    const st = state[id];
                    if (st?.status === 'pass') p++;
                    if (st?.status === 'fail') {
                        f++;
                        details += `<div class="p-3 bg-rose-50 border border-rose-100 rounded-lg text-xs">
                            <p class="font-bold text-slate-800">#${id}: ${item}</p>
                            <p class="text-rose-600 mt-1 italic">Note: ${st.note || '-'}</p>
                        </div>`;
                    }
                    if (st?.status === 'skip') s++;
                });
            });

            document.getElementById('sumPass').innerText = p;
            document.getElementById('sumFail').innerText = f;
            document.getElementById('sumSkip').innerText = s;
            document.getElementById('failureDetails').innerHTML = details || '<p class="text-center text-slate-400 text-sm italic">No issues found.</p>';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function copySummary() {
            let t = "QA SUMMARY REPORT\n------------------\n";
            t += `PASS: ${document.getElementById('sumPass').innerText}\nFAIL: ${document.getElementById('sumFail').innerText}\nSKIP: ${document.getElementById('sumSkip').innerText}\n\n`;
            t += "ISSUE LOG:\n" + document.getElementById('failureDetails').innerText;
            navigator.clipboard.writeText(t).then(() => alert("Copied to clipboard!"));
        }

        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        render();
    </script>
</body>
</html>
