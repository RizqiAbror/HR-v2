version: '3.8'

services:
  app:
    build: .
    container_name: hr2_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Koneksi database diarahkan ke service 'db' (MariaDB)
      - DATABASE_URL=mysql://root:rootpassword@db:3306/hr2
    depends_on:
      - db
    # Uncomment 2 baris di bawah ini jika ingin live-reload saat development:
    # volumes:
    #   - .:/usr/src/app
    #   - /usr/src/app/node_modules

  db:
    # Menggunakan MariaDB (bisa juga diganti mysql:8 jika perlu)
    image: mariadb:10.11
    container_name: hr2_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hr2
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
